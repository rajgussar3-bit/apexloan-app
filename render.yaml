services:
  - type: web
    name: apexloan-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: LENDER_NAME
        value: "Vistas Tecnolabs Finance Limited"
      - key: PAYMENT_GATEWAY
        value: "cashfree"
